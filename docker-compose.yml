services:
  api:
    # Hazır imaj GitHub Actions tarafından üretilir (bkz. .github/workflows/ci.yml).
    # Pi'de: docker compose pull && docker compose up -d
    # Yerelde kaynaktan derlemek için: docker compose up -d --build
    image: ghcr.io/furkanmar/cari-takip-backend:${IMAGE_TAG:-latest}
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: cari-takip-api
    restart: unless-stopped
    # Dışarıya port açılmıyor: cloudflared, web ağı üzerinden http://cari-takip-api:3000 adresine ulaşır.
    environment:
      - NODE_ENV=production
      - DB_SYNCHRONIZE=${DB_SYNCHRONIZE:-true}
      - DB_LOGGING=${DB_LOGGING:-false}
      - CORS_ORIGIN=${CORS_ORIGIN}
      - REGISTER_ENABLED=${REGISTER_ENABLED:-false}
      - DB_HOST=db
      - DB_PORT=5432
      - DB_USERNAME=${DB_USERNAME}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_NAME=${DB_NAME}
      - JWT_SECRET=${JWT_SECRET}
      - JWT_REFRESH_SECRET=${JWT_REFRESH_SECRET}
      - MINIO_ENDPOINT=minio
      - MINIO_PORT=9000
      - MINIO_ACCESS_KEY=${MINIO_ACCESS_KEY}
      - MINIO_SECRET_KEY=${MINIO_SECRET_KEY}
      - MINIO_BUCKET=${MINIO_BUCKET}
    depends_on:
      db:
        condition: service_healthy
      minio:
        condition: service_healthy
    networks:
      - web
      - internal

  frontend:
    image: ghcr.io/furkanmar/cari-takip-frontend:${IMAGE_TAG:-latest}
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - NEXT_PUBLIC_API_URL=https://cari-api.marifoglu.trade/api
    container_name: cari-takip-web
    restart: unless-stopped
    # Tarayıcı API'ye doğrudan cari-api.marifoglu.trade üzerinden gider; iç ağa gerek yok.
    networks:
      - web

  db:
    image: postgres:16-alpine
    container_name: cari-takip-db
    restart: unless-stopped
    environment:
      - POSTGRES_USER=${DB_USERNAME}
      - POSTGRES_PASSWORD=${DB_PASSWORD}
      - POSTGRES_DB=${DB_NAME}
    volumes:
      - cari-takip-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${DB_USERNAME} -d ${DB_NAME}']
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - internal

  minio:
    # minio/minio Docker Hub'dan kaldırıldı; Pigsty topluluğunun sürdürdüğü uyumlu fork.
    image: pgsty/minio:latest
    container_name: cari-takip-minio
    restart: unless-stopped
    environment:
      - MINIO_ROOT_USER=${MINIO_ACCESS_KEY}
      - MINIO_ROOT_PASSWORD=${MINIO_SECRET_KEY}
    volumes:
      - cari-takip-minio-data:/data
    command: server /data --console-address ":9001"
    healthcheck:
      test: ['CMD-SHELL', 'mc ready local || curl -fs http://localhost:9000/minio/health/live']
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - internal

volumes:
  cari-takip-db-data:
  cari-takip-minio-data:

networks:
  # Sunucudaki ortak ağ (cloudflared burada). Önceden oluşturuldu: docker network create web
  web:
    external: true
  # Sadece bu projenin servisleri arasında; internete ve cloudflared'e kapalı.
  internal:
    internal: true
